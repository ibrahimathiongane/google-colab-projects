# Static marketing site — no API, no gateway, no service worker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are declared per location: nginx stops inheriting
    # add_header directives as soon as a location declares its own.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/png;

    # Product screenshots live in /images (public/, not hashed by Vite).
    location /images/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    # Assets are content-hashed by Vite → safe to cache hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Never cache the HTML shell: language/CTA URLs may change per deploy.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok\n";
    }
}
