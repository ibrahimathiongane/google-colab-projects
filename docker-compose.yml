version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit"]
      interval: 5s
      timeout: 3s
      retries: 10

  users:
    build: ./services/users
    environment:
      DATABASE_URL: postgresql://habit:habit@postgres:5432/habit_tracker
      JWT_SECRET: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy

  habits:
    build: ./services/habits
    environment:
      DATABASE_URL: postgresql://habit:habit@postgres:5432/habit_tracker
    depends_on:
      postgres:
        condition: service_healthy

  tracking:
    build: ./services/tracking
    environment:
      DATABASE_URL: postgresql://habit:habit@postgres:5432/habit_tracker
    depends_on:
      postgres:
        condition: service_healthy

  insights:
    build: ./services/insights
    environment:
      DATABASE_URL: postgresql://habit:habit@postgres:5432/habit_tracker
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      JWT_SECRET: dev-secret-change-me
      USERS_URL: http://users:8000
      HABITS_URL: http://habits:8000
      TRACKING_URL: http://tracking:8000
      INSIGHTS_URL: http://insights:8000
    ports:
      - "8000:8000"
    depends_on:
      - users
      - habits
      - tracking
      - insights

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  pgdata:
