name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check gateway services migrations
      # One pytest process per app: services share module names
      # (main, models, db, schemas).
      - name: pytest (one run per app)
        run: |
          set -e
          for app in gateway services/users services/habits services/tracking services/insights; do
            echo "==> $app"
            python -m pytest "$app/tests" -q
          done

  frontend:
    name: Frontend (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  landing:
    name: Landing (eslint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-not-used
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      # The prod override must stay renderable (required vars fail fast)
      # and the edge config must stay valid.
      - name: Production compose config
        env:
          DOMAIN: example.com
          APP_HOST: app.example.com
          ALLOWED_ORIGINS: https://app.example.com
          POSTGRES_PASSWORD: ci-only
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Caddyfile validates
        env:
          DOMAIN: example.com
          APP_HOST: app.example.com
        run: >
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e DOMAIN -e APP_HOST caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile
