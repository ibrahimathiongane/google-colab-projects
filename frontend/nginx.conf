server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets are content-hashed by Vite → safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell or the service worker (Phase 2).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API: same-origin reverse proxy to the gateway.
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Security headers (Phase 0 baseline).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
