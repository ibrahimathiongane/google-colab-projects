server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are declared per location: nginx stops inheriting
    # add_header directives as soon as a location declares its own.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The service worker controls the whole cache: never serve it stale.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets are content-hashed by Vite → safe to cache hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Never cache the HTML shell (Phase 2 will add the same for i18n JSON).
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # API: same-origin reverse proxy to the gateway.
    #
    # nginx resolves proxy_pass hostnames ONCE at startup: when compose
    # recreates the gateway (deploy, E2E) the cached IP can end up on
    # another container and every /api/* silently 404s there. Resolving
    # through Docker's embedded DNS at request time (variable proxy_pass)
    # keeps the upstream correct across container recreations.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://gateway:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    location = /health {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
